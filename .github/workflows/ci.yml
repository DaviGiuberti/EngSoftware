# Roda em todo PR e em todo push na main. A Definition of Done pede que ela passe antes do merge.
# Depois do merge, o job release publica o .exe numa release do GitHub (RNF16).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Privilégio mínimo: por padrão, nenhum job escreve no repositório. Só o release ganha escrita.
permissions:
  contents: read

jobs:
  qualidade:
    # Windows, o mesmo sistema em que o app roda (RNF03).
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # O pytest-qt abre as janelas sem tela.
      QT_QPA_PLATFORM: offscreen
      # A saída das ferramentas em UTF-8, para os acentos aparecerem certos no log e um
      # caractere fora do cp1252 não derrubar o passo. Não muda como o app lê arquivos.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      # Um comando por passo: no PowerShell da CI, só o código de saída do último comando
      # de um passo decide se ele falha.
      - name: Lint (RNF13)
        run: ruff check .

      - name: Typecheck (RNF13)
        run: mypy src

      - name: Teste de arquitetura (RNF12)
        run: lint-imports

      - name: Testes com cobertura
        run: pytest --cov=plataforma

      # Só o domain/: exigir 90% do projeto inteiro levaria a escrever teste inútil.
      - name: Cobertura do domain/ de pelo menos 90% (RNF11)
        run: coverage report --include="*/domain/*" --fail-under=90

      - name: Dependências sem vulnerabilidade conhecida (RNF09)
        # O próprio app não está no PyPI, por isso fica de fora da busca.
        run: pip-audit --skip-editable

  # O deploy de um app local: cada merge na main vira uma release com o .exe (RNF16).
  # Só roda no push na main e depois que o qualidade passou. Num PR, ele aparece como pulado.
  release:
    needs: qualidade
    if: github.event_name == 'push'
    # O PyInstaller só gera o .exe para o sistema em que roda (ADR 0001).
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Gerar dist/plataforma.exe
        run: pyinstaller plataforma.spec

      # O .exe gerado aqui, a partir deste commit, é o mesmo arquivo que vai para a release.
      # O N de v0.1.N é o número da execução da CI. Como os PRs também contam, as versões pulam
      # números (v0.1.3, v0.1.7...), mas nunca se repetem.
      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.1.${{ github.run_number }}" dist/plataforma.exe --target "${{ github.sha }}" --generate-notes
